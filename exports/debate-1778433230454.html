<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRD 辩论报告 - 兼容性测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
    }
    h1 { 
      font-size: 24px; 
      border-bottom: 2px solid #3B82F6; 
      padding-bottom: 10px; 
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    h2 { 
      font-size: 18px; 
      color: #3B82F6;
      margin-top: 30px;
      margin-bottom: 15px;
      border-left: 4px solid #3B82F6;
      padding-left: 12px;
    }
    h3 {
      font-size: 16px;
      color: #555;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    p { margin-bottom: 15px; text-align: justify; }
    blockquote {
      background: #f8f9fa;
      border-left: 4px solid #ddd;
      padding: 12px 16px;
      margin: 15px 0;
      font-style: italic;
      color: #555;
    }
    ul, ol { margin-left: 25px; margin-bottom: 15px; }
    li { margin-bottom: 5px; }
    strong { color: #1a1a1a; }
    hr { 
      border: none; 
      border-top: 1px solid #e5e7eb; 
      margin: 30px 0; 
    }
    .meta-info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #666;
    }
    .status-passed { color: #10B981; font-weight: bold; }
    .status-warning { color: #F59E0B; font-weight: bold; }
    .status-failed { color: #EF4444; font-weight: bold; }
    .footer {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 40px;
      font-style: italic;
    }
    @media print {
      body { margin: 0; padding: 20px; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="meta-info no-print" style="text-align:center;margin-bottom:20px;">
    <p style="margin:0;">💡 提示：按 <strong>Ctrl+P</strong> 可将此页面保存为 PDF</p>
  </div>
  
  <p><h1>脑痒 辩论报告</h1></p><p><strong>生成时间</strong>: 2026/5/11 01:13:50<br><strong>辩论话题</strong>: 兼容性测试<br><strong>辩论状态</strong>: 已完成</p><p>---<br>*本报告由 Taolun PRD Debate Dashboard 自动生成*</p>
  
  <div class="footer">
    本报告由 脑痒 自动生成
  </div>

  <script>
    window.onload = function() {
      if (window.matchMedia('print').matches) {
        document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');
      }
    };
  </script>
</body>
</html>
