<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <clipPath id="bookClip">
      <rect x="24" y="20" width="80" height="96" rx="4"/>
    </clipPath>
  </defs>
  
  <!-- Book Base -->
  <rect x="24" y="20" width="80" height="96" rx="4" fill="url(#bookGrad)"/>
  
  <!-- Book Pages (Stacked Effect) -->
  <g clip-path="url(#bookClip)">
    <rect x="28" y="28" width="72" height="6" rx="1" fill="white" opacity="0.3"/>
    <rect x="28" y="38" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="46" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="54" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="62" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="70" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="78" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
    <rect x="28" y="86" width="72" height="4" rx="1" fill="white" opacity="0.2"/>
  </g>
  
  <!-- Bookmark -->
  <path d="M64 20 L64 50 L72 42 L80 50 L80 20" fill="url(#bookGrad2)"/>
  
  <!-- Brain Icon on Book Cover -->
  <g transform="translate(44, 56)">
    <path d="M20 4 C12 4 6 10 6 16 C6 24 12 28 20 28 C24 28 28 30 28 34 C28 38 30 38 32 34 C34 30 38 28 40 28 C48 28 54 24 54 16 C54 10 48 4 40 4" 
          stroke="white" stroke-width="2.5" fill="none"/>
    <path d="M14 12 Q18 16 14 22" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M46 12 Q42 16 46 22" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M30 10 L30 20" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Itch marks (thought sparks) -->
  <g stroke="#FBBF24" stroke-width="2" stroke-linecap="round">
    <line x1="12" y1="28" x2="6" y2="22"/>
    <line x1="10" y1="32" x2="2" y2="32"/>
    <line x1="116" y1="28" x2="122" y2="22"/>
    <line x1="118" y1="32" x2="126" y2="32"/>
    <line x1="14" y1="16" x2="10" y2="8"/>
    <line x1="114" y1="16" x2="118" y2="8"/>
  </g>
</svg>