<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="chatGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="chatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Chat Bubble 1 (Left) -->
  <g filter="url(#chatGlow)">
    <path d="M20 30 C20 20 30 16 40 16 L70 16 C80 16 88 20 92 28 L108 28 C116 28 120 36 120 44 C120 52 116 60 108 60 L80 60 L68 76 L68 60 L40 60 C30 60 20 54 20 44 C20 38 20 34 20 30" 
          fill="url(#chatGrad)"/>
    
    <!-- Brain Icon in Bubble -->
    <g transform="translate(52, 28)">
      <path d="M16 6 C10 6 6 10 6 14 C6 18 10 22 14 22 C16 22 18 24 18 26 C18 28 20 28 22 26 C24 24 26 22 26 20 C26 18 26 16 24 14 C22 10 18 6 16 6" 
            stroke="white" stroke-width="1.5" fill="none" opacity="0.9"/>
      <path d="M10 12 Q12 14 10 18" stroke="white" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M22 12 Q20 14 22 18" stroke="white" stroke-width="1" fill="none" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Chat Bubble 2 (Right) -->
  <path d="M20 74 C20 68 28 64 36 64 L66 64 L74 64 L74 80 L74 96 C74 104 66 108 58 108 L36 108 C26 108 20 102 20 92 C20 86 20 80 20 74" 
        fill="url(#chatGrad2)" opacity="0.9" transform="translate(20, 0)"/>
  
  <!-- Itch marks representing active discussion -->
  <g stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="8" y1="44" x2="2" y2="38"/>
    <line x1="6" y1="48" x2="0" y2="48"/>
    <line x1="126" y1="88" x2="132" y2="82"/>
    <line x1="128" y1="92" x2="134" y2="92"/>
  </g>
</svg>