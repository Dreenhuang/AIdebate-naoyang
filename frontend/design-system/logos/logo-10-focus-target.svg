<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <radialGradient id="focusCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="50%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </radialGradient>
    <filter id="focusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer targeting rings -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#focusGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#focusGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#focusGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#focusGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Crosshair lines -->
  <g stroke="url(#focusGrad)" stroke-width="1.5" opacity="0.5">
    <line x1="64" y1="4" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="124"/>
    <line x1="4" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="124" y2="64"/>
  </g>
  
  <!-- Corner brackets -->
  <g stroke="url(#focusGrad)" stroke-width="3" fill="none" opacity="0.8">
    <!-- Top-left -->
    <path d="M24 32 L24 24 L32 24"/>
    <!-- Top-right -->
    <path d="M96 24 L104 24 L104 32"/>
    <!-- Bottom-left -->
    <path d="M24 96 L24 104 L32 104"/>
    <!-- Bottom-right -->
    <path d="M104 96 L104 104 L96 104"/>
  </g>
  
  <!-- Center brain icon -->
  <g transform="translate(48, 48)" filter="url(#focusGlow)">
    <path d="M16 4 C8 4 4 10 4 16 C4 24 10 28 16 28 C20 28 22 30 22 34 C22 38 24 38 26 34 C28 30 32 28 34 28 C42 28 46 24 46 16 C46 10 40 4 34 4" 
          stroke="#3B82F6" stroke-width="2" fill="none"/>
    <path d="M10 12 Q14 16 10 22" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M30 12 Q26 16 30 22" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="20" cy="16" r="3" fill="url(#focusCenter)"/>
  </g>
  
  <!-- Itch marks radiating outward -->
  <g stroke="#EC4899" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="4" y1="48" x2="-4" y2="48"/>
    <line x1="8" y1="44" x2="0" y2="38"/>
    <line x1="124" y1="48" x2="132" y2="48"/>
    <line x1="120" y1="44" x2="128" y2="38"/>
    <line x1="48" y1="4" x2="48" y2="-4"/>
    <line x1="80" y1="4" x2="80" y2="-4"/>
  </g>
</svg>