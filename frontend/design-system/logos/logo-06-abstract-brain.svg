<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="abstractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <radialGradient id="abstractCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </radialGradient>
    <filter id="abstractGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Abstract Brain Shape with Connections -->
  <g filter="url(#abstractGlow)">
    <!-- Main brain curves -->
    <path d="M64 16 C40 16 24 32 24 52 C24 72 40 80 48 88 C56 96 72 96 80 88 C88 80 104 72 104 52 C104 32 88 16 64 16" 
          fill="url(#abstractGrad)" opacity="0.9"/>
    
    <!-- Internal abstract connections (like neural paths) -->
    <g stroke="white" stroke-width="1.5" fill="none" opacity="0.4">
      <path d="M40 40 Q50 50 40 60 Q30 70 50 80"/>
      <path d="M64 32 Q64 50 64 68 Q64 86 64 96"/>
      <path d="M88 40 Q78 50 88 60 Q98 70 78 80"/>
      
      <!-- Cross connections -->
      <path d="M40 50 Q52 55 64 50 Q76 45 88 50"/>
      <path d="M48 64 Q56 64 64 64 Q72 64 80 64"/>
    </g>
    
    <!-- Nodes at intersections -->
    <g fill="white" opacity="0.8">
      <circle cx="40" cy="40" r="3"/>
      <circle cx="64" cy="32" r="4"/>
      <circle cx="88" cy="40" r="3"/>
      <circle cx="48" cy="64" r="3"/>
      <circle cx="64" cy="64" r="5"/>
      <circle cx="80" cy="64" r="3"/>
      <circle cx="40" cy="88" r="3"/>
      <circle cx="64" cy="96" r="3"/>
      <circle cx="88" cy="88" r="3"/>
    </g>
  </g>
  
  <!-- Radiating itch/energy lines -->
  <g stroke="url(#abstractGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="16" y1="24" x2="8" y2="16"/>
    <line x1="12" y1="32" x2="4" y2="28"/>
    <line x1="16" y1="104" x2="8" y2="112"/>
    <line x1="12" y1="96" x2="4" y2="100"/>
    <line x1="112" y1="24" x2="120" y2="16"/>
    <line x1="116" y1="32" x2="124" y2="28"/>
    <line x1="112" y1="104" x2="120" y2="112"/>
    <line x1="116" y1="96" x2="124" y2="100"/>
  </g>
  
  <!-- Center glow -->
  <circle cx="64" cy="64" r="20" fill="url(#abstractCenter)" opacity="0.3"/>
</svg>